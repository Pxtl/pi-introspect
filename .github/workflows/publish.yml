name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must equal the package.json version)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify declared version matches package version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            EXPECTED="${TAG#v}"
          else
            EXPECTED="$INPUT_VERSION"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$VERSION" ]; then
            echo "Declared version v${EXPECTED} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
