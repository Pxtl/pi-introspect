# Publishes pi-introspect to npm via trusted publishing (OIDC). No token is
# needed: the npm registry is pre-configured to trust pushes from this repo
# (see the npm "trusted publishing" setup for this package). Triggered by
# pushing a version tag (e.g. v1.2.3) whose number matches package.json, or
# manually via the "Run workflow" action (handy for debugging).

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must equal the package.json version)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Re-tries (workflow_dispatch) publish main. Fail fast, informatively, if
      # the manual run was started on any other branch.
      - name: Guard: workflow_dispatch re-tries must run on main
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "::error::workflow_dispatch re-tries must run on 'main' (current: '${{ github.ref_name }}')." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify declared version matches package version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            EXPECTED="${TAG#v}"
          else
            EXPECTED="$INPUT_VERSION"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$VERSION" ]; then
            echo "Declared version v${EXPECTED} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Publish to npm
        # --ignore-scripts: this package has no publish scripts; skip them so
        # a future lifecycle script cannot run arbitrary code at publish time.
        run: npm publish --ignore-scripts
