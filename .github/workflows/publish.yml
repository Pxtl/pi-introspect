# Publishes pi-introspect to npm via trusted publishing (OIDC). No token is
# needed: the npm registry is pre-configured to trust tag pushes from this
# repo (see the npm "trusted publishing" setup for this package). Triggered
# by pushing a version tag (e.g. v1.2.3) whose number matches package.json.

name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Publish to npm
        # --ignore-scripts: this package has no publish scripts; skip them so
        # a future lifecycle script cannot run arbitrary code at publish time.
        run: npm publish --ignore-scripts
